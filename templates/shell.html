<link rel="stylesheet" href="__CSS__">
<section class="bahi-ai" id="bahi-ai" dir="rtl" lang="ar">
  <div class="bahi-ai__inner">
    <header class="bahi-ai__head">
      <p class="bahi-ai__eyebrow">مساعدك الشخصي في عالم العطور</p>
      <h1 class="bahi-ai__title">مستشار باهي</h1>
      <p class="bahi-ai__sub">احكيلي عن ذوقك، وأنا أساعدك تلاقي العطر اللي يشبهك.</p>
      <div class="bahi-ai__rule" aria-hidden="true"></div>
    </header>

    <div class="bahi-ai__panel">
      <div class="bahi-ai__bar">
        <span class="bahi-ai__status"><span class="bahi-ai__dot" aria-hidden="true"></span>متاح الآن</span>
        <button type="button" class="bahi-ai__new" data-bahi-new hidden>محادثة جديدة</button>
      </div>
      <div class="bahi-ai__log" data-bahi-log role="log" aria-live="polite" aria-label="المحادثة"></div>
      <form class="bahi-ai__composer" data-bahi-form>
        <label class="bahi-ai__sr" for="bahi-ai-input">اكتب رسالتك</label>
        <textarea id="bahi-ai-input" data-bahi-input rows="1" maxlength="800"
                  placeholder="اسأل عن أي حاجة في العطور…" autocomplete="off"></textarea>
        <button type="submit" class="bahi-ai__send" data-bahi-send aria-label="إرسال">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
      </form>
      <p class="bahi-ai__note">مستشار باهي بيستخدم الذكاء الاصطناعي وممكن يغلط أحيانًا.</p>
    </div>
  </div>
  <noscript><p class="bahi-ai__sub">لازم تفعّل JavaScript عشان تقدر تتكلم مع المستشار.</p></noscript>
</section>
<script>window.BAHI_AI = __CONFIG__;</script>
<script src="__JS__" defer></script>
